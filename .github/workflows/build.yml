name: Build

on:
  push:
  pull_request:

jobs:
  simulateur-pc:
    name: Simulateur PC (SDL2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependances
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev cmake
      - name: Compilation
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

  esp32:
    name: ESP32-S3 (ESP-IDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilation idf.py
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          path: esp32
